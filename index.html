<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BetSwahn FPL</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#14061f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BetSwahn">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#14061f;--panel:#220a35;--panel2:#2d0f45;--burg:#7a1c2e;--burg2:#a3283f;--purple:#5b2a86;--text:#f4ecf8;--muted:#b9a3c9;--gold:#e9c46a;--up:#4cd68a;--down:#ff6b7a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14061f}}
:root[data-theme="dark"]{--bg:#14061f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#3a1258 0%,var(--bg) 60%) fixed,var(--bg);color:var(--text);font-family:"Josefin Sans","Trebuchet MS",system-ui,sans-serif;line-height:1.5}
h1,h2,h3,h4{font-family:"Josefin Sans","Trebuchet MS",system-ui,sans-serif;text-transform:uppercase;letter-spacing:.05em;margin:0}
.wrap{max-width:900px;margin:0 auto;padding:0 16px 48px}
header{text-align:center;padding:36px 0 6px}
header img{width:132px;height:132px;border-radius:50%;box-shadow:0 0 0 3px var(--burg2),0 0 40px rgba(163,40,63,.55)}
header h1{font-size:2.6rem;margin-top:14px;letter-spacing:.08em}
header p{color:var(--muted);margin:4px 0 0}
nav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:18px 0 0}
nav a{color:var(--text);text-decoration:none;padding:8px 16px;border-radius:99px;background:var(--panel2);border:1px solid var(--purple);font-size:.9rem}
nav a:hover,nav a:focus-visible{background:var(--burg);outline:2px solid var(--gold)}
section{margin-top:36px}
section>h2{font-size:1.6rem;margin-bottom:4px}
.sub{color:var(--muted);margin:0 0 14px;font-size:.9rem}
.live{display:inline-flex;align-items:center;padding:7px 18px;border-radius:99px;background:linear-gradient(120deg,var(--burg),var(--purple));border:1px solid var(--gold);color:var(--text);font-weight:800;font-size:1.05rem;letter-spacing:.03em;box-shadow:0 0 14px rgba(163,40,63,.45)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--up);animation:p 1.6s infinite}
@keyframes p{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.live i{animation:none}}
.tablebox{background:var(--panel);border:1px solid var(--purple);border-radius:16px;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:560px}
th{font-size:.75rem;color:var(--muted);font-weight:600;text-align:center;padding:10px 6px;background:var(--panel2)}
th:nth-child(2){text-align:left}
td{padding:9px 6px;text-align:center;border-top:1px solid rgba(255,255,255,.06);font-size:.92rem}
td.pos{width:44px;font-weight:700}
td.team{text-align:left}
.tm{display:flex;align-items:center;gap:10px}
.crest{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.8rem;color:#fff;flex:none;border:2px solid rgba(255,255,255,.35)}
.tm b{display:block;line-height:1.1}.tm small{color:var(--muted)}
td.pts{font-weight:700;font-size:1.05rem}
tr.top td.pos{box-shadow:inset 4px 0 var(--gold);color:var(--gold)}
tr.bot td.pos{box-shadow:inset 4px 0 var(--down)}
.mv{font-size:.75rem;display:block}.mv.u{color:var(--up)}.mv.d{color:var(--down)}.mv.s{color:var(--muted)}
.form{display:inline-flex;gap:3px}
.form span{width:18px;height:18px;border-radius:4px;font-size:.65rem;display:grid;place-items:center;font-weight:700;color:#14061f}
.W{background:var(--up)}.D{background:var(--gold)}.L{background:var(--down)}
.hero-award{display:grid;gap:14px;grid-template-columns:1fr 1fr}
@media(max-width:640px){.hero-award{grid-template-columns:1fr}}
.big{background:linear-gradient(135deg,var(--burg),var(--purple));border-radius:18px;padding:20px;border:1px solid rgba(233,196,106,.5)}
.big h3{font-size:1.2rem}
.big .who{display:flex;align-items:center;gap:12px;margin:12px 0 6px}
.big .crest{width:52px;height:52px;font-size:1rem}
.big .name{font-size:1.4rem;font-family:"Josefin Sans","Trebuchet MS",system-ui,sans-serif}
.big p{margin:0;color:#ecd9f3;font-size:.9rem}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin-top:14px}
.card{background:var(--panel);border:1px solid var(--purple);border-radius:14px;padding:16px}
.card .ic{font-size:1.6rem}
.card h3{font-size:1.05rem;margin:4px 0 2px}
.card .d{color:var(--muted);font-size:.82rem;margin:0 0 10px}
.card .w{display:flex;align-items:center;gap:8px}
.card .w .crest{width:28px;height:28px;font-size:.7rem}
.card .w span{font-weight:700}
.card .w em{color:var(--gold);font-style:normal;margin-left:auto;font-size:.85rem}
.hist{margin-top:14px;background:var(--panel);border:1px solid var(--purple);border-radius:14px;padding:6px 16px}
.hist div{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid rgba(255,255,255,.06)}
.hist div:first-child{border-top:0}
.hist b{color:var(--gold)}
tbody tr{cursor:pointer}tbody tr:hover td,tbody tr:focus-visible td{background:rgba(163,40,63,.18)}tbody tr:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
.tip{color:var(--muted);font-size:.8rem;margin:8px 4px 0}
.ov{position:fixed;inset:0;background:rgba(10,2,18,.8);display:none;align-items:flex-end;justify-content:center;z-index:50;padding-top:env(safe-area-inset-top,0px)}
.ov.on{display:flex}
.sheet{background:var(--panel);border:1px solid var(--purple);border-radius:20px 20px 0 0;width:100%;max-width:640px;max-height:90vh;overflow-y:auto;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px))}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:20px}}
.sh{display:flex;align-items:center;gap:14px}
.sh .crest{width:60px;height:60px;font-size:1.1rem}
.sh h3{font-size:1.4rem}.sh small{color:var(--muted)}
.x{margin-left:auto;background:var(--panel2);border:1px solid var(--purple);color:var(--text);width:38px;height:38px;border-radius:50%;font-size:1.1rem;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:16px 0}
.stat{background:var(--panel2);border-radius:12px;padding:10px 12px}
.stat small{color:var(--muted);display:block;font-size:.75rem}
.stat b{font-size:1.15rem}
.stat.hl{background:linear-gradient(135deg,var(--burg),var(--purple))}
.sheet h4{font-size:.95rem;margin:18px 0 8px}
.chips span{display:inline-block;padding:4px 12px;border-radius:99px;font-size:.8rem;margin:0 6px 6px 0;background:var(--purple)}
.chips span.now{background:var(--up);color:#14061f}
.sq div,.sn div{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid rgba(255,255,255,.06);font-size:.92rem}
.sq div:first-child,.sn div:first-child{border-top:0}
.sq b{margin-left:auto;min-width:28px;text-align:center;padding:2px 8px;border-radius:6px;background:var(--panel2)}
.sq b.g{background:var(--up);color:#14061f}
.sq em{font-style:normal;font-size:.7rem;background:#fff;color:#14061f;border-radius:50%;width:20px;height:20px;display:grid;place-items:center;font-weight:700}
.sn span:first-child{width:62px;color:var(--muted)}
.bar{flex:1;height:8px;background:var(--panel2);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--burg2),var(--purple))}
.sn span:last-child{width:50px;text-align:right;font-weight:700}
.sn small{color:var(--muted);width:78px;text-align:right}
.gb{display:flex;gap:6px;align-items:flex-end;height:130px;margin-top:6px}
.gb div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:3px;font-size:.72rem;color:var(--muted)}
.gb i{display:block;width:100%;border-radius:5px 5px 0 0;background:linear-gradient(180deg,var(--burg2),var(--purple))}
.gb .best i{background:var(--up)}.gb .worst i{background:var(--down)}
.gb b{color:var(--text);font-size:.78rem}
.fake{color:var(--muted);font-size:.75rem;margin:14px 0 0}
.nodata{color:var(--muted);font-size:.9rem;margin-top:14px}
.lt{display:grid;gap:10px}
.lh,.rw{display:grid;grid-template-columns:40px minmax(0,1fr) 70px 42px 52px;column-gap:6px;align-items:center}
.lh{color:var(--muted);font-size:.72rem;padding:0 12px;text-align:center}.lh span:nth-child(2){text-align:left}
.rw{background:linear-gradient(120deg,var(--panel),var(--panel2));border:1px solid var(--purple);border-radius:16px;padding:12px;cursor:pointer;row-gap:8px}
.rw:hover,.rw:focus-visible{border-color:var(--burg2);outline:0;box-shadow:0 0 0 2px var(--burg2)}
.ps{grid-row:1/4;display:flex;flex-direction:column;align-items:center;gap:4px}
.cw.r1 .rw{border-color:#e9c46a;box-shadow:inset 4px 0 #e9c46a,0 0 18px rgba(233,196,106,.25)}
.cw.r2 .rw{border-color:#c4cad6;box-shadow:inset 4px 0 #c4cad6,0 0 16px rgba(196,202,214,.2)}
.cw.r3 .rw{border-color:#cd7f32;box-shadow:inset 4px 0 #cd7f32,0 0 16px rgba(205,127,50,.22)}
.cw.r1 .ps b{color:#e9c46a}.cw.r2 .ps b{color:#c4cad6}.cw.r3 .ps b{color:#cd7f32}
.ps b{font-family:"Josefin Sans","Trebuchet MS",system-ui,sans-serif;font-size:1.5rem;line-height:1}
.ps .mv{padding:1px 7px;border-radius:99px;background:rgba(255,255,255,.1)}
.nm{min-width:0}.nm b{display:block;font-size:1.02rem;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm small{color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.nm .form span{width:14px;height:14px;font-size:.55rem;border-radius:3px}
.cp2{text-align:center;line-height:1.2}.cp2 b{display:block;font-size:.85rem;color:var(--gold)}.cp2 small{color:var(--muted);font-size:.68rem}
.gp{text-align:center}.gp b{font-size:1.1rem;display:block}.gp small{color:var(--down);font-size:.72rem}
.tt{text-align:center;font-weight:700;font-size:1.2rem}
.cr{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cp{font-size:.7rem;font-weight:700;padding:2px 9px;border-radius:7px;border:1px solid var(--purple);color:var(--text)}
.cp.u{text-decoration:line-through;opacity:.5;color:var(--muted)}
.cp.a{background:var(--gold);color:#14061f;border-color:var(--gold);box-shadow:0 0 12px rgba(233,196,106,.7)}
.tb{margin-left:auto;font:inherit;font-size:.75rem;font-weight:700;color:var(--text);background:var(--burg);border:1px solid var(--burg2);border-radius:99px;padding:3px 12px;cursor:pointer}
.tb:hover,.tb:focus-visible{background:var(--burg2);outline:2px solid var(--gold)}
.tp{background:var(--panel2);border:1px solid var(--purple);border-top:0;border-radius:0 0 14px 14px;margin:-6px 10px 0;padding:12px 12px 8px}
.tl{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:.9rem;flex-wrap:wrap}
.tl .o{color:var(--down)}.tl .n{color:var(--up);font-weight:700}.tl i{font-style:normal;color:var(--muted)}.tl small{margin-left:auto;color:var(--muted)}
.tl.hit{color:var(--down);font-size:.8rem}
.seg{display:flex;gap:8px;margin:0 0 14px}
.seg button{flex:1;font:inherit;font-weight:700;font-size:.9rem;color:var(--text);background:var(--panel2);border:1px solid var(--purple);border-radius:12px;padding:10px 8px;cursor:pointer}
.seg button.on{background:linear-gradient(120deg,var(--burg),var(--purple));border-color:var(--gold);box-shadow:0 0 14px rgba(163,40,63,.5)}
.seg button:focus-visible{outline:2px solid var(--gold)}
.lt.compact .lh,.lt.compact .rw{grid-template-columns:40px minmax(0,1fr) 52px}
.lt.compact .lh span:nth-child(3),.lt.compact .lh span:nth-child(4),.lt.compact .cp2,.lt.compact .gp,.lt.compact .cr,.lt.compact .tp{display:none}
.lt.compact .ps{grid-row:auto}.lt.compact .rw{padding:10px 12px}
.lt.compact{gap:6px}
#rows{display:grid;gap:8px}
.lt.compact #rows{gap:5px}
.pt{font-size:.62rem;font-weight:800;border-radius:6px;padding:3px 0;width:40px;text-align:center;color:#14061f}
.t1{background:#e9c46a}.t2{background:#5fc3b0}.t3{background:#9a88f5}.t4{background:#ff6b9a}
.sq2{margin-top:6px}
.pl{display:grid;grid-template-columns:42px 1fr auto;gap:5px 10px;align-items:center;background:var(--panel2);border-radius:12px;padding:9px 10px;margin-bottom:6px;border-left:4px solid var(--purple)}
.pl.inn{background:linear-gradient(90deg,rgba(76,214,138,.16),var(--panel2))}
.pl.out{background:linear-gradient(90deg,rgba(255,107,122,.16),var(--panel2))}
.pn{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.pn b{font-size:1rem}
.ar{font-size:.8rem;font-weight:800}.ar.up{color:var(--up)}.ar.dn{color:var(--down)}
.cb{font-style:normal;font-size:.68rem;font-weight:800;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:#14061f}.cb.v{background:#fff}
.pq{text-align:right}.pp{font-size:1.2rem}.pp.dim{opacity:.5}.pq small{display:block;font-size:.65rem;color:var(--gold)}
.pm{grid-column:2/-1;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.op{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:6px;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.4)}.op.none{background:var(--purple)}
.stt{font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:99px}
.stt.f{background:rgba(76,214,138,.2);color:var(--up)}.stt.x{background:rgba(255,107,122,.2);color:var(--down)}.stt.u{background:rgba(185,163,201,.18);color:var(--muted)}
.stt.l{background:rgba(255,159,67,.2);color:#ffb870;display:inline-flex;align-items:center;gap:5px}
.stt.l i{width:7px;height:7px;border-radius:50%;background:#ff9f43;animation:p 1.2s infinite}
@media(prefers-reduced-motion:reduce){.stt.l i{animation:none}}
.ev{margin-left:auto;font-size:.8rem}
.bl{color:var(--muted);font-size:.78rem;font-weight:700;margin:12px 2px 6px}
.chips.sm span.lv{background:#ff9f43;color:#14061f}
.sub{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
#tabell{margin-top:16px}
.pl.p1{border-left-color:#e9c46a}.pl.p2{border-left-color:#5fc3b0}.pl.p3{border-left-color:#9a88f5}.pl.p4{border-left-color:#ff6b9a}
.stt{white-space:nowrap}.stt.x{font-size:.85rem;padding:1px 8px}
.lg{background:var(--panel2);border-radius:12px;padding:12px 14px;margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:7px 12px;font-size:.8rem;color:var(--muted)}
.lg .lgh{grid-column:1/-1;color:var(--text);font-family:"Josefin Sans","Trebuchet MS",system-ui,sans-serif;font-size:.95rem}
.lg .wide{grid-column:1/-1}
.lg b{color:var(--text);margin-right:5px;font-weight:700}
.lg .sw{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:middle;margin-right:2px}
.chg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.ch{position:relative;background:var(--panel2);border:1px solid var(--purple);border-radius:14px;padding:12px;overflow:hidden}
.ch .ci{font-size:1.6rem;line-height:1}.ch .cn{font-weight:800;margin:6px 0 4px}
.cl2{font-size:.78rem;color:var(--muted)}.cl2 b{color:var(--text)}
.ch.a{background:linear-gradient(135deg,rgba(233,196,106,.28),var(--panel2));border-color:var(--gold);box-shadow:0 0 18px rgba(233,196,106,.35)}
.ch.a .cl2{color:var(--gold)}.ch.a .cl2 b{color:#fff}
.ch.u{border-style:dashed}.ch.u .ci{filter:grayscale(1);opacity:.45}.ch.u .cn{text-decoration:line-through;text-decoration-thickness:2px;opacity:.6}
.plw{margin-bottom:6px}.plw .pl{margin-bottom:0;cursor:pointer}
.plw .pl:focus-visible{outline:2px solid var(--gold)}
.plw .pl[aria-expanded="true"]{border-bottom-left-radius:0;border-bottom-right-radius:0}
.pd{background:#1b0930;border:1px solid var(--purple);border-top:0;border-radius:0 0 12px 12px;padding:10px 12px 12px}
.bk{background:var(--panel2);border-radius:10px;padding:8px 12px;margin-bottom:8px}
.bkh{font-weight:800;border-bottom:1px solid var(--muted);padding-bottom:4px;margin-bottom:4px;font-size:.92rem}
.bkr,.bkt{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:.85rem}
.bkt{border-top:2px solid var(--muted);margin-top:4px;font-weight:800}
.bkr b.pos{color:var(--up)}.bkr b.neg{color:var(--down)}
.bkr i{font-size:.65rem;color:var(--gold);font-style:normal}
.bkm{font-size:.8rem;color:var(--gold);margin:0 2px 8px}
.ownh{font-weight:800;margin:10px 0 2px}.ownt{color:var(--muted);font-size:.78rem;margin:8px 0 3px;font-weight:700}
.ow{display:flex;align-items:center;gap:10px;padding:5px 0;border-top:1px solid rgba(255,255,255,.07);font-size:.88rem}
.ow b{width:22px;color:var(--gold)}.ow.me{color:var(--gold);font-weight:700}.ow.none{color:var(--muted)}
.hint{color:var(--muted);font-size:.78rem;margin:8px 2px 0}
.ch:not(.u):not(.a){border:2px solid var(--burg2);box-shadow:0 0 12px rgba(163,40,63,.4)}
.ks{grid-column:2/-1;display:flex;gap:8px;flex-wrap:wrap}
.ks span{font-size:.74rem;font-weight:700;padding:2px 11px;border-radius:99px;border:1px solid var(--purple);color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.ks span b{color:var(--text)}
.ks .k1.on{border-color:#ff9f43;color:#ffb870;background:rgba(255,159,67,.14)}
.ks .k1 i{width:7px;height:7px;border-radius:50%;background:#ff9f43;animation:p 1.2s infinite}
.ks .k2.on{border-color:var(--gold);color:var(--gold);background:rgba(233,196,106,.1)}
.lt.compact .ks{display:none}
@media(prefers-reduced-motion:reduce){.ks .k1 i{animation:none}}
.trb{background:var(--panel2);border-radius:12px;padding:6px 14px;margin-top:6px}
.upd{background:linear-gradient(135deg,var(--panel),var(--panel2));border:1px solid var(--burg2);border-radius:16px;padding:30px 20px;text-align:center}
.upd .ui{font-size:2.2rem}.upd h3{font-size:1.35rem;margin:6px 0}.upd p{color:var(--muted);margin:0}
.pl{grid-template-columns:34px minmax(0,1fr) auto auto;gap:5px 8px;padding:8px 10px}
.pt{width:34px;font-size:.58rem}
.pn{flex-wrap:nowrap;min-width:0;gap:5px}.pn b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.95rem}
.pm{grid-column:auto;flex-wrap:nowrap;gap:5px}
.op{font-size:.68rem;padding:2px 6px;white-space:nowrap}.stt{font-size:.68rem;padding:2px 8px}
.pq{min-width:22px}.pp{font-size:1.1rem}.cb,.ar{flex:none}
@media(max-width:350px){.pl{grid-template-columns:34px minmax(0,1fr) auto}.pm{grid-column:2/-1;grid-row:2}.pq{grid-column:3;grid-row:1}}
.sr{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid rgba(255,255,255,.07)}.sr:first-child{border-top:0}
.sy{width:58px;color:var(--muted);font-size:.9rem;flex:none}
.sb{position:relative;flex:1;min-width:0;height:26px;background:var(--panel2);border-radius:7px;overflow:hidden;display:flex;align-items:center;justify-content:space-between;padding:0 8px;font-size:.78rem;font-weight:700}
.sb i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--burg),var(--purple));border-radius:7px 0 0 7px}
.sb span,.sb em{position:relative;z-index:1;font-style:normal}.sb em{color:var(--gold)}
.sk{min-width:88px;text-align:right;font-size:1rem;font-weight:800;flex:none}
.ov{align-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet{border-radius:22px;max-height:calc(100vh - 48px);max-height:calc(100dvh - 48px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));padding:20px 18px 24px;box-shadow:0 24px 70px rgba(0,0,0,.65)}
.bl{text-transform:uppercase;letter-spacing:.06em}
.tb{background:transparent;border:1px solid var(--purple);color:var(--muted);font-weight:600}
.tb:hover,.tb:focus-visible{background:rgba(255,255,255,.06);color:var(--text);outline:2px solid var(--gold)}
.ov{overscroll-behavior:contain}
.sheet{display:flex;flex-direction:column;overflow:hidden;padding:0}
.sheet .sh{flex:none;padding:18px 18px 12px;border-bottom:1px solid rgba(255,255,255,.08)}
.sbody{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:0 18px 24px}
.sbody>h4:first-child{margin-top:16px}
.hist div{justify-content:flex-start;align-items:center;gap:14px}
.hist div span{width:72px;color:var(--muted)}
.hist div b{display:inline-flex;align-items:center;gap:10px}
.hist .tr{width:30px;height:30px;object-fit:contain;flex:none}
.hf{display:flex;align-items:center;gap:12px}.hf .tr{width:40px;height:40px;object-fit:contain;flex:none}
.chg .ch,.chg .ch.u,.chg .ch.a,.chg .ch:not(.u):not(.a){border:0;box-shadow:none}
.upl{font-size:.7rem;color:var(--muted);opacity:.7;white-space:nowrap}
.hfh{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:-4px}
.hfh .tr{height:122px;width:auto;flex:none;object-fit:contain;margin-bottom:6px}
.pl{grid-template-columns:34px minmax(0,1fr) auto;grid-template-rows:auto auto;gap:4px 10px;padding:9px 10px}
.pt{grid-row:1/3;align-self:center}
.pn{grid-column:2;grid-row:1}
.pq{grid-column:3;grid-row:1;align-self:center}
.pm{grid-column:2/-1;grid-row:2;flex-wrap:nowrap;gap:6px;align-items:center}
.clb{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);font-size:.78rem}
.stt.z{background:rgba(185,163,201,.12);color:var(--muted)}
#gwP,#gwN{display:none;all:unset;cursor:pointer;align-items:center;padding:4px 8px;border-radius:99px;color:var(--text)}
#gwP:hover,#gwN:hover{background:rgba(255,255,255,.12)}#gwP:focus-visible,#gwN:focus-visible{outline:2px solid var(--gold)}
.live{padding:5px 8px;gap:4px;align-items:center}
.big{position:relative}
.big .king{position:absolute;right:14px;top:12px;width:56px;height:56px;filter:drop-shadow(0 0 9px rgba(233,196,106,.65))}
.card .w.none span{color:var(--muted);font-weight:400}
.cimg{width:48px;height:48px;object-fit:contain;display:block}

nav button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--purple);border-radius:99px;padding:8px 16px;font-size:.9rem;cursor:pointer}
nav button.on{background:linear-gradient(120deg,var(--burg),var(--purple));border-color:var(--gold)}
nav button:hover,nav button:focus-visible{outline:2px solid var(--gold)}
.lh button{all:unset;cursor:pointer;color:var(--muted);font-size:.72rem;text-align:center;padding:4px 0}
.lh button.on{color:var(--gold);font-weight:700}.lh button:focus-visible{outline:2px solid var(--gold)}
.aimg,.hi{display:block;background-size:contain;background-repeat:no-repeat;background-position:center}
.aimg{width:46px;height:46px}
.hi{position:absolute;right:12px;top:10px;width:66px;height:66px;filter:drop-shadow(0 0 8px rgba(233,196,106,.5))}
.big,.card{cursor:pointer}.big:focus-visible,.card:focus-visible{outline:2px solid var(--gold)}
.big .name.none{color:#e7d6f1;font-size:1.1rem}
.gnav{display:flex;align-items:center;justify-content:center;gap:14px;margin:14px 0 8px}
.gnav b{min-width:130px;text-align:center;letter-spacing:.04em}
.gnb{all:unset;cursor:pointer;display:inline-flex;padding:6px 12px;border-radius:99px;background:var(--panel2);border:1px solid var(--purple);color:var(--text)}
.gnb[disabled]{opacity:.3;cursor:default}.gnb:focus-visible{outline:2px solid var(--gold)}
.cap{text-transform:capitalize}
.bkb{all:unset;cursor:pointer;color:var(--muted);font-size:.85rem;margin-top:14px;display:inline-block}
.adesc{color:var(--muted);margin:2px 0 12px;font-size:.9rem}
.awin{display:flex;align-items:center;gap:12px;background:linear-gradient(120deg,var(--burg),var(--purple));border-radius:14px;padding:14px;border:1px solid var(--gold)}
.awin b{font-size:1.1rem;display:block}.awin small{color:#e7d6f1}
.awin em{margin-left:auto;font-style:normal;color:var(--gold);font-weight:700;text-align:right;max-width:48%;font-size:.9rem}
.awin.none{background:var(--panel2);border-color:var(--purple)}
.ow em{margin-left:auto;font-style:normal;color:var(--gold)}.ow small{color:var(--muted)}
.mh{color:var(--muted);font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin:16px 2px 6px}
.mw{margin-bottom:6px}
.mt{display:grid;grid-template-columns:1fr auto 1fr;gap:4px 10px;align-items:center;background:var(--panel2);border-radius:12px;padding:10px 12px;cursor:pointer;border-left:4px solid var(--purple);font-size:.9rem}
.mt:focus-visible{outline:2px solid var(--gold)}
.mt .ta{text-align:right}.mt .sc{font-size:1.1rem}
.mt .ms{grid-column:1/-1;justify-self:center;font-size:.72rem;font-weight:700;padding:1px 10px;border-radius:99px}
.ms.f{background:rgba(76,214,138,.2);color:var(--up)}.ms.u{background:rgba(185,163,201,.18);color:var(--muted)}
.ms.l{background:rgba(255,159,67,.2);color:#ffb870;display:inline-flex;gap:5px;align-items:center}
.ms.l i{width:7px;height:7px;border-radius:50%;background:#ff9f43;animation:p 1.2s infinite}
.md{background:#1b0930;border:1px solid var(--purple);border-top:0;border-radius:0 0 12px 12px;padding:10px 12px 12px}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.mct{font-weight:800;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--muted);padding-bottom:3px;margin-bottom:4px}
.mcr{font-size:.82rem;padding:2px 0}.mcr b{color:var(--gold);font-weight:600}.mcr.none{color:var(--muted)}
.w2{margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.08)}
.w2 b{display:block;font-size:1rem;line-height:1.25}
.w2 span{display:block;color:var(--muted);font-size:.85rem}
.w2 em{display:block;margin-top:4px;font-style:normal;color:var(--gold);font-weight:700}
.w2.none b{color:var(--muted);font-weight:400}
.gb{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.gb::-webkit-scrollbar{display:none}

  const out=[];(EVENTS||[]).filter(e=>e.id<=CURGW).forEach(e=>{const d=new Date(e.deadline_time),k=d.getFullYear()+"-"+d.getMonth();let m=out.find(z=>z.k===k);if(!m){m={k,label:d.toLocaleDateString("sv-SE",{month:"long",year:"numeric"}),first:e.id,lastGW:e.id};out.push(m)}m.lastGW=e.id});
  return out;
}
let awQ=Promise.resolve();
function awardsFor(n){return (awQ=awQ.catch(()=>{}).then(()=>awardsRaw(n)))}
async function awardsRaw(n){
  if(!LIVEMODE||n===GW)return {AWARDS,WEEK,MONTH};
  if(AWC[n]&&n<CURGW)return AWC[n];
  const sv={L,GW,GWDONE,UPDATED,AWARDS,WEEK,MONTH};
  try{await loadLive(n);const r={AWARDS,WEEK,MONTH};if(n<CURGW)AWC[n]=r;return r}
  finally{L=sv.L;GW=sv.GW;GWDONE=sv.GWDONE;UPDATED=sv.UPDATED;AWARDS=sv.AWARDS;WEEK=sv.WEEK;MONTH=sv.MONTH}
}
function prefetchAw(){
  if(!LIVEMODE||SH.type!=="award"||!ov.classList.contains("on"))return;
  const ms=monthsList(),n=SH.key==="month"?(ms[SH.mi-1]?ms[SH.mi-1].lastGW:0):SH.n-1;
  if(n>=1&&n<CURGW&&n!==GW&&!AWC[n])awardsFor(n).catch(()=>{});
}
const AWNAME={king:"Omgångens kung",month:"Månadens manager"};
function awardDetailHtml(a,nav){
  const w=a.w,dl=det=>`<div class="od">${det.map(d=>`<div class="odr"><span>${d.n}${d.c?` <small>${d.c}</small>`:""}</span><b>${d.p} p</b></div>`).join("")}</div>`;
  const win=w?`<div class="awin"><div><b>${a.team||w}</b><small>${a.full||w}</small></div><em>${a.v||""}</em></div>`+(a.det&&a.det.length?`<div class="ownt">Poäng som lämnades på bänken</div>${dl(a.det)}`:""):'<div class="awin none"><b>Ingen vinnare den här gången</b></div>';
  const list=(a.list&&a.list.length)?'<div class="ownt">Topplista</div>'+a.list.map((o,i)=>{const has=o.det&&o.det.length;return `<div class="ow${has?" tg":""}"${has?' tabindex="0" role="button" aria-expanded="false"':""}><b>${i+1}</b><span>${o.t} <small>${o.full||o.n}</small></span><em>${o.v}</em></div>${has?`<div class="od" hidden>${o.det.map(d=>`<div class="odr"><span>${d.n}${d.c?` <small>${d.c}</small>`:""}</span><b>${d.p} p</b></div>`).join("")}</div>`:""}`}).join(""):"";
  return `<button type="button" class="bkb" data-back>‹ Alla awards</button>${nav}<p class="adesc">${a.d||""}</p>${win}${list}`;
}
async function renderAward(){
  const month=SH.key==="month",ms=month?monthsList():[];
  try{
    const n=month?(ms[SH.mi]?ms[SH.mi].lastGW:GW):SH.n;
    const d=await awardsFor(n);
    const a=SH.key==="king"?d.WEEK:month?d.MONTH:d.AWARDS.find(z=>z.k===SH.key);
    const nav=!LIVEMODE?"":month?gnav("award",`<span class="cap">${ms[SH.mi]?ms[SH.mi].label:""}</span>`,SH.mi,0,ms.length-1):gnav("award","Omgång "+n,SH.n,1,CURGW);
    setBody(awardDetailHtml(a,nav));prefetchAw();
  }catch(e){console.error(e);setBody('<button type="button" class="bkb" data-back>‹ Alla awards</button><p class="sub">Kunde inte hämta awards.</p>')}
}
async function openAward(key){
  const ms=monthsList();let mi=Math.max(0,ms.length-1);ms.forEach((m,i)=>{if(GW>=m.first&&GW<=m.lastGW)mi=i});
  SH={type:"award",key,n:GW,mi};
  const a=AWARDS.find(z=>z.k===key);const t=document.getElementById("mT");if(t)t.textContent=a?a.t:AWNAME[key];
  setBody('<p class="sub">Laddar…</p>');await renderAward();
}
async function navSheet(type,d){
  if(type==="matches"){const t=SH.n+d;if(t<1||t>CURGW)return;SH.n=t;setBody('<p class="sub">Laddar…</p>');await renderMatches()}
  else if(type==="award"){
    if(SH.key==="month"){const t=SH.mi+d;if(t<0||t>=monthsList().length)return;SH.mi=t}
    else{const t=SH.n+d;if(t<1||t>CURGW)return;SH.n=t}
    setBody('<p class="sub">Laddar…</p>');await renderAward();
  }
}
function dismissSheet(){if(SH.type==="award"&&ov.classList.contains("on")){SH={type:"awards"};showSection("Awards",awardsOverviewHtml(),"nAw")}else closeM()}
function openM(n){SH={};
  const x=byName(n),d=x.d||demoD(x),rank=sorted.indexOf(x)+1,S=seriesOf(x);lastFocus=document.activeElement;
  const mx=Math.max(...S.g),pool=GWDONE?S.g:S.g.slice(0,-1),mn=pool.length?Math.min(...pool):null;
  let h="";const hd=`<div class="sh"><div><h3 id="mT">${x.t}</h3><small>${d.full||x.n}</small></div><button class="x" aria-label="Stäng" id="cl">✕</button></div>`;
  h+=squadHtml(x);
  h+=`<h4>Transfers omgång ${GW}</h4><div class="trb">${trPanel(x)}</div>`;
  h+=chipsHtml(x);
  h+=`<h4>Säsongen 26/27</h4><div class="stats">${st("Placering",rank+" av "+L.length)}${st("Totalt",x.pts+" p")}${st("Omgång "+GW,x.g+" p")}${st("Live-rank",d.live)}${st("Omgångsrank",d.gwrank)}${st("Snittrank, 3 senaste",d.avg3)}${st("Safety-poäng",d.safety)}${st("Bank",d.bank)}${st("Lagvärde",d.val)}${st("Bästa poäng",mx+" p (omg. "+S.e[S.g.indexOf(mx)]+")")}${st("Sämsta poäng",mn==null?"–":mn+" p (omg. "+S.e[S.g.indexOf(mn)]+")")}</div>`;
  h+=chartHtml(S,mx,mn,pool.length);
  h+=historyHtml(d);
  h+=seasonsHtml(d);
  sheet.innerHTML=hd+`<div class="sbody">${h}</div>`;ov.classList.add("on");lockBody();{const gbx=sheet.querySelector(".gb");if(gbx)gbx.scrollLeft=gbx.scrollWidth}document.getElementById("cl").focus();
}
let locked=false,sy=0;
function lockBody(){if(locked||typeof window==="undefined"||!document.body)return;locked=true;sy=window.scrollY||0;const b=document.body.style;b.position="fixed";b.top=-sy+"px";b.left="0";b.right="0";b.width="100%"}
function unlockBody(){if(!locked)return;locked=false;const b=document.body.style;b.position="";b.top="";b.left="";b.right="";b.width="";window.scrollTo(0,sy)}
function closeM(){SH={};ov.classList.remove("on");unlockBody();setNav("nTab");if(lastFocus)lastFocus.focus()}
document.getElementById("rows").addEventListener("click",e=>{const b=e.target.closest(".tb");if(b){const p=b.closest(".cw").querySelector(".tp");p.hidden=!p.hidden;b.setAttribute("aria-expanded",!p.hidden);return}const r=e.target.closest(".rw");if(r)openM(r.dataset.n)});
document.getElementById("rows").addEventListener("keydown",e=>{if(e.target.classList.contains("tb"))return;if(e.key==="Enter"||e.key===" "){const r=e.target.closest(".rw");if(r){e.preventDefault();openM(r.dataset.n)}}});
ov.addEventListener("click",e=>{if(e.target===ov)closeM();else if(e.target.id==="cl")dismissSheet()});
const togP=r=>{const d=r.nextElementSibling;if(!d)return;d.hidden=!d.hidden;r.setAttribute("aria-expanded",!d.hidden)};
sheet.addEventListener("click",e=>{const r=e.target.closest(".pl");if(r)togP(r)});
sheet.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){const r=e.target.closest(".pl");if(r){e.preventDefault();togP(r)}}});
sheet.addEventListener("click",e=>{
  const g=e.target.closest(".gnb");if(g){if(!g.disabled)navSheet(g.dataset.nav,+g.dataset.d);return}
  if(e.target.closest("[data-back]")){SH={type:"awards"};showSection("Awards",awardsOverviewHtml(),"nAw");return}
  const k=e.target.closest("[data-k]");if(k){openAward(k.dataset.k);return}
  const m=e.target.closest(".mt,.tg");if(m)togP(m);
});
sheet.addEventListener("keydown",e=>{if(e.key!=="Enter"&&e.key!==" ")return;const t=e.target.closest(".mt,.tg,[data-k]");if(t){e.preventDefault();t.click()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")dismissSheet()});
const fit=()=>document.querySelectorAll(".nm b").forEach(b=>{b.style.fontSize="";let fs=parseFloat(getComputedStyle(b).fontSize)||16;while(b.scrollWidth>b.clientWidth&&fs>11){fs-=.5;b.style.fontSize=fs+"px"}});
const lt=document.querySelector(".lt"),segB=[...document.querySelectorAll(".seg button")];
const setV=v=>{lt.classList.toggle("compact",v==="compact");segB.forEach(b=>{const on=b.dataset.v===v;b.classList.toggle("on",on);b.setAttribute("aria-pressed",on)});try{localStorage.setItem("bsv",v)}catch(e){}setTimeout(fit,0)};
segB.forEach(b=>b.onclick=()=>setV(b.dataset.v));
try{setV(localStorage.getItem("bsv")||"")}catch(e){setV("")}
if(typeof window!=="undefined")window.addEventListener("resize",fit);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);
let isUpd=false;
const UPQ=[".seg",".lh",".tip","#awards","#hall"];
const setUpd=on=>{isUpd=on;
  if(on){document.getElementById("rows").innerHTML=`<div class="upd"><div class="ui">🛠️</div><h3>Spelet uppdateras</h3><p>FPL uppdaterar spelet inför nästa omgång. Tabellen visas här igen så fort det är klart. Sidan försöker igen automatiskt varje minut.</p></div>`;
    UPQ.forEach(q=>{const el=document.querySelector(q);if(el)el.style.display="none"});
    document.getElementById("gw").textContent="–";document.getElementById("upd").textContent="–"}
  else UPQ.forEach(q=>{const el=document.querySelector(q);if(el)el.style.display=""})};
if(PROXY&&!FORCE_DEMO)setInterval(async()=>{
  if(ov.classList.contains("on")||SEL!==null)return;
  try{await awQ.catch(()=>{});await loadLive(SEL);if(isUpd)setUpd(false);paint()}
  catch(e){console.error(e);if(String(e&&e.message)==="503"&&!isUpd)setUpd(true)}
},60000);
})();
</script>
</body>
</html>
