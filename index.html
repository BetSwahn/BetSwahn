<style>

.sk{min-width:88px;text-align:right;font-size:1rem;font-weight:800;flex:none}
.ov{align-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet{border-radius:22px;max-height:calc(100vh - 48px);max-height:calc(100dvh - 48px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));padding:20px 18px 24px;box-shadow:0 24px 70px rgba(0,0,0,.65)}
.bl{text-transform:uppercase;letter-spacing:.06em}
.tb{background:transparent;border:1px solid var(--purple);color:var(--muted);font-weight:600}
.tb:hover,.tb:focus-visible{background:rgba(255,255,255,.06);color:var(--text);outline:2px solid var(--gold)}
.ov{overscroll-behavior:contain}
.sheet{display:flex;flex-direction:column;overflow:hidden;padding:0}
.sheet .sh{flex:none;padding:18px 18px 12px;border-bottom:1px solid rgba(255,255,255,.08)}
.sbody{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:0 18px 24px}
.sbody>h4:first-child{margin-top:16px}
.hist div{justify-content:flex-start;align-items:center;gap:14px}
.hist div span{width:72px;color:var(--muted)}
.hist div b{display:inline-flex;align-items:center;gap:10px}
.hist .tr{width:30px;height:30px;object-fit:contain;flex:none}
.hf{display:flex;align-items:center;gap:12px}.hf .tr{width:40px;height:40px;object-fit:contain;flex:none}
.chg .ch,.chg .ch.u,.chg .ch.a,.chg .ch:not(.u):not(.a){border:0;box-shadow:none}
.upl{font-size:.7rem;color:var(--muted);opacity:.7;white-space:nowrap}
.hfh{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:-4px}
.hfh .tr{height:122px;width:auto;flex:none;object-fit:contain;margin-bottom:6px}
.pl{grid-template-columns:34px minmax(0,1fr) auto;grid-template-rows:auto auto;gap:4px 10px;padding:9px 10px}
.pt{grid-row:1/3;align-self:center}
.pn{grid-column:2;grid-row:1}
.pq{grid-column:3;grid-row:1;align-self:center}
.pm{grid-column:2/-1;grid-row:2;flex-wrap:nowrap;gap:6px;align-items:center}
.clb{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);font-size:.78rem}
footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:40px}
</style>

function resolve(sq,chip){

 const cap=sq.find(k=>k.c),vc=sq.find(k=>k.v);
 if(cap&&vc&&gone(cap)&&vc.mn>0&&cap.m>0){vc.m=cap.m;cap.m=1}
 if(chip==="bboost")return;
 const xi=sq.filter(k=>k.pos<=11),bn=sq.filter(k=>k.pos>11).sort((a,b)=>a.pos-b.pos);
 const swap=(o,s)=>{o.m=0;o.out=true;s.m=s.m>0?s.m:1;s.in=true;xi[xi.indexOf(o)]=s};
 const gk=xi.find(k=>k.ty===1),bgk=bn.find(k=>k.ty===1);
 if(gk&&bgk&&gone(gk)&&bgk.mn>0)swap(gk,bgk);
 for(const o of xi.filter(k=>k.ty>1&&gone(k)).sort((a,b)=>a.pos-b.pos)){
  const ok=k=>{const c=t=>xi.filter(x=>x.ty===t&&x!==o).length+(k.ty===t?1:0);return c(2)>=3&&c(3)>=2&&c(4)>=1};
  const s=bn.find(k=>k.ty>1&&!k.in&&k.mn>0&&ok(k));
  if(s)swap(o,s);
 }
}

  return `<h4>Poäng per omgång</h4><div class="gb">${bars}</div>`
  +`<h4>Mer statistik</h4><div class="stats">${st("Kapten omg. "+GW,cap)}${st("Vicekapten",vc)}${st("Bänkpoäng, säsong",Math.round(r()*40+8)+" p")}${st("Transfers, säsong",Math.round(r()*8+4))}${st("Minuspoäng","-"+Math.floor(r()*3)*4+" p")}${st("Bästa omgång",mx+" p (omg. "+(gws.indexOf(mx)+1)+")")}${st("Sämsta omgång",mn+" p (omg. "+(gws.indexOf(mn)+1)+")")}${st("Global rank",gl)}</div>`
